spring.application.name=HuertoHogar-Backend

# Valores locales (contrasena de la BD, JWT_SECRET). Ese archivo no se sube a Git;
# hay un ejemplo en application-local.properties.example
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

server.port=8085

# Documentacion OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- JWT (autenticacion) ---
# El secreto debe tener al menos 32 caracteres. Se define en JWT_SECRET o en application-local.properties
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracion-minutos=60

# --- Usuarios de demostracion (admin, vendedor y cliente), se crean al arrancar si no existen ---
app.demo.usuarios=true

# Las respuestas de error incluyen el texto ("Correo ya registrado", etc.) para mostrarlo en el frontend
server.error.include-message=always
